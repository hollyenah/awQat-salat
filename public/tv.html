<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>awQat-salat</title>
<link rel="stylesheet" href="style-tv.css">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<script src="qr.js"></script>
</head>
<body>

  <div class="status-dot" id="statusDot" aria-hidden="true"></div>

<div id="stage">
  <img id="logo" class="logo" src="/logo.png" alt="" onerror="this.style.display='none'">

  <!-- Bouton toggle QR + QR code en haut à droite -->
  <div class="qr-control" id="qrControl">
    <button class="qr-toggle" id="qrToggle" type="button" title="Afficher / masquer le QR code">
      <span id="qrToggleIcon">▣</span>
    </button>
    <div class="qr-wrap" id="qrWrap" hidden>
      <div id="qrSvg"></div>
    </div>
  </div>


  <header class="header">
    <h1 id="mosqueName">MASJID</h1>
    <div class="meta">
      <span id="displayDate" style="color:#feebb2;"></span>
      <span id="clock">--:--:--</span>
    </div>
  </header>

  <div class="divider" aria-hidden="true">
    <span class="line"></span><span class="diamond"></span><span class="line"></span>
  </div>

  <main class="grid" id="grid">
    <div class="card" data-key="sahour"><span class="label">SAHOUR</span><span class="time">--:--</span></div>
    <div class="card" data-key="fajr"><span class="label">FAJR</span><span class="time">--:--</span></div>
    <div class="card" data-key="sunrise"><span class="label">LEVER DU SOLEIL</span><span class="time">--:--</span></div>
    <div class="card" data-key="zuhr"><span class="label">ZOUHR</span><span class="time">--:--</span></div>
    <div class="card" data-key="asr"><span class="label">ASSR</span><span class="time">--:--</span></div>
    <div class="card" data-key="maghrib"><span class="label">MAGHRIB</span><span class="time">--:--</span></div>
    <div class="card" data-key="isha"><span class="label">ISHA</span><span class="time">--:--</span></div>
    <div class="card" data-key="jumuah"><span class="label">JOUM'AH</span><span class="time">--:--</span></div>
</main>

  <footer class="footer" id="footerWrap" hidden>
    <p id="footerMessage"></p>
  </footer>
    <p class="watermark">&copy;2026 awQat-salat.app - Qassim.<span id="appVersion">version?</span></p>

</div>

<!--script>window.__DEBUG__ = true;</script-->

<script>
  const mosqueNameEl = document.getElementById('mosqueName');
  const displayDateEl = document.getElementById('displayDate');
  const clockEl = document.getElementById('clock');
  const footerWrap = document.getElementById('footerWrap');
  const footerMessageEl = document.getElementById('footerMessage');
  const statusDot = document.getElementById('statusDot');

  const cardEls = {};
  document.querySelectorAll('.card').forEach((c) => { cardEls[c.dataset.key] = c; });

  const DAILY_ORDER = ['fajr', 'zuhr', 'asr', 'maghrib', 'isha'];
  let currentPrayers = {};

  let hijriOffset = 0;
  let showGregorian = true;
  let showHijri = true;

const HIJRI_MONTHS = [
  "Mouharram", "Safar", "Rabioul-Awwal", "Rabioul-Akhir",
  "Joumadal-Oula", "Joumadal-Akhira", "Rajab", "Cha'bân",
  "Ramadan", "Chawwal", "Zou al-Qi'da", "Zoul-Hijja"
];


// Algo calcule mois Greg > Hijri
function gregorianToHijri(gy, gm, gd, offset){
  let jd = Math.floor((1461 * (gy + 4800 + Math.floor((gm - 14) / 12))) / 4) +
           Math.floor((367 * (gm - 2 - 12 * Math.floor((gm - 14) / 12))) / 12) -
           Math.floor((3 * Math.floor((gy + 4900 + Math.floor((gm - 14) / 12)) / 100)) / 4) +
           gd - 32075;
  jd += (offset || 0);
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l - 1) / 10631);
  l = l - 10631 * n + 354;
  const j = Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719) +
            Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
  l = l - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) -
      Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
  const hm = Math.floor((24 * l) / 709);
  const hd = l - Math.floor((709 * hm) / 24);
  const hy = 30 * n + j - 30;
  return { year: hy, month: hm, day: hd };
}

function capitalize(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function updateDateDisplay(){
  const now = new Date();
  const gregorian = capitalize(now.toLocaleDateString('fr-FR', {
    weekday: 'long', day: 'numeric', month: 'numeric', year: 'numeric'
  }));
  const h = gregorianToHijri(now.getFullYear(), now.getMonth() + 1, now.getDate(), hijriOffset);
  const hijri = `${h.day} ${HIJRI_MONTHS[h.month - 1]} ${h.year}`;
  const parts = [];
  if (showGregorian) parts.push(gregorian);
  if (showHijri) parts.push(hijri);
  displayDateEl.innerHTML = parts.map((p) => `<span>${p}</span>`).join('<span class="date-sep"> ✼ </span>');
  displayDateEl.style.display = parts.length ? '' : 'none';
  const sepEl = document.getElementById('dateSep');
  if (sepEl) sepEl.style.display = parts.length ? '' : 'none';
}

  function setStatus(ok){
    statusDot.style.background = ok ? '#4caf6b' : '#c0524a';
  }

  function parseHM(str){
    if (typeof str !== 'string') return null;
    const m = str.trim().match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    const h = parseInt(m[1], 10), min = parseInt(m[2], 10);
    if (h > 23 || min > 59) return null;
    return h * 60 + min;
  }

  function updateHighlight(){
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();

    let nextKey = null;
    let best = Infinity;

    DAILY_ORDER.forEach((key) => {
      const mins = parseHM(currentPrayers[key]);
      if (mins === null) return;
      const diff = mins - nowMin;
      if (diff >= 0 && diff < best) { best = diff; nextKey = key; }
    });

    // Après Isha : Fajr loop
    if (nextKey === null) nextKey = 'fajr';

    DAILY_ORDER.forEach((key) => {
      cardEls[key].classList.toggle('next', key === nextKey);
    });
  }

  var lastQRUrl = '';

  // QR code
  var qrInitialized = false;
  var qrVisible = false;

  function renderQR(ip, port) {
    if (qrInitialized) return;
    try {
      var host = (ip && port) ? (ip + ':' + port) : window.location.host;
      var url = 'http://' + host + '/admin.html';
      document.getElementById('qrSvg').innerHTML = QR.toSVG(url, 4);
      qrInitialized = true;
    } catch (e) {
      console.warn('QR generation failed', e);
      document.getElementById('qrControl').style.display = 'none';
    }
  }

  function setQRVisible(visible) {
    qrVisible = visible;
    document.getElementById('qrWrap').hidden = !visible;
    document.getElementById('qrToggleIcon').textContent = visible ? '-' : '+';
  }

  function toggleQR() {
    var newState = !qrVisible;
    setQRVisible(newState);

    // Sauvegarde côté serveur (comme le toggle admin)
    fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ showQR: newState })
    }).catch(function () { /* ignore */ });
  }

  document.getElementById('qrToggle').addEventListener('click', toggleQR);


  function render(data){
    if (!data) return;
    mosqueNameEl.textContent = data.mosqueName || '';
    document.getElementById('logo').style.display = data.showLogo ? '' : 'none';
    hijriOffset = Number.isFinite(data.hijriOffset) ? data.hijriOffset : 0;
    showGregorian = data.showGregorian !== false;
    showHijri = data.showHijri !== false;
    updateDateDisplay();
    currentPrayers = data.prayers || {};

    // 7 cartes fixes (dans l'ordre de la grille)
    ['sahour','fajr','sunrise','zuhr','asr','maghrib','isha'].forEach((key) => {
      if (cardEls[key]) {
        cardEls[key].querySelector('.time').textContent = currentPrayers[key] || '--:--';
      }
    });

    // 8ᵉ case : Jumu'ah OU Tahajud selon le toggle
    const useTahajud = data.showTahajud === true;
    const eighthKey   = useTahajud ? 'tahajud' : 'jumuah';
    const eighthLabel = useTahajud ? 'TAHAJUD'  : "JOUM'AH";
    if (cardEls.jumuah) {
      cardEls.jumuah.querySelector('.label').textContent = eighthLabel;
      cardEls.jumuah.querySelector('.time').textContent  = currentPrayers[eighthKey] || '--:--';
    }

    footerMessageEl.textContent = data.footerMessage || '';
    footerWrap.hidden = !data.showFooter;

    updateHighlight();
    // QR code
    renderQR(data._localIP, data._port);
    setQRVisible(data.showQR !== false);
    fitStage();
      
  }

  function tickClock(){
    clockEl.textContent = new Date().toLocaleTimeString('fr-FR', {
      hour: '2-digit', minute: '2-digit' /*, second: '2-digit'*/
    });

    updateDateDisplay();
    updateHighlight();
  }

  // Chargement initial
  fetch('/api/data').then((r) => r.json()).then(render).catch(() => {});

  // Mises à jour instantanées depuis l'administration
  const es = new EventSource('/api/events');
  es.onopen = () => setStatus(true);
  es.onerror = () => setStatus(false);
  es.onmessage = (e) => {
    try { render(JSON.parse(e.data)); setStatus(true); } catch (err) { /* ignore */ }
  };

  tickClock();
  setInterval(tickClock, 1000);

const STAGE_W = 1920;
const STAGE_H = 1080;
const stage = document.getElementById('stage');

function fitStage(){

  // Récupère toutes les tailles candidates et filtre les valeurs aberrantes
  const candidatesW = [
    window.innerWidth,
    document.documentElement.clientWidth,
    window.screen ? window.screen.width      : 0,
    window.screen ? window.screen.availWidth : 0,
    (window.visualViewport ? window.visualViewport.width : 0)
  ].filter(function(v){ return v > 200 && v < 8000; });

  const candidatesH = [
    window.innerHeight,
    document.documentElement.clientHeight,
    window.screen ? window.screen.height      : 0,
    window.screen ? window.screen.availHeight : 0,
    (window.visualViewport ? window.visualViewport.height : 0)
  ].filter(function(v){ return v > 200 && v < 8000; });

  // PLUS PETITE > élimine les valeurs TV aberrantes
  const vw = Math.min.apply(null, candidatesW);
  const vh = Math.min.apply(null, candidatesH);

  const scale = Math.min(vw / STAGE_W, vh / STAGE_H);

  stage.style.transform = 'scale(' + scale + ')';

  // Debug visible sur la TV
  if (window.__DEBUG__) {
    let dbg = document.getElementById('__dbg');
    if (!dbg) {
      dbg = document.createElement('div');
      dbg.id = '__dbg';
      dbg.style.cssText = 'position:fixed;bottom:0;left:0;background:#000;color:#0f0;' +
        'font:12px monospace;padding:6px 10px;z-index:9999;white-space:pre;opacity:.85';
      document.body.appendChild(dbg);
    }
    dbg.textContent =
      'innerW=' + window.innerWidth +
      ' innerH=' + window.innerHeight + '\n' +
      'screenW=' + (window.screen ? window.screen.width : '?') +
      ' screenH=' + (window.screen ? window.screen.height : '?') + '\n' +
      'dpr=' + (window.devicePixelRatio || 1) +
      '  ->  vw=' + vw + ' vh=' + vh + ' scale=' + scale.toFixed(3);
  }
}

  // Version de l'app, récupérée une seule fois au démarrage
  fetch('/api/version')
    .then((r) => r.json())
    .then((d) => {
      const el = document.getElementById('appVersion');
      if (el && d.version) el.textContent = '· v' + d.version;
    })
    .catch(() => {});

</script>
</body>
</html>
