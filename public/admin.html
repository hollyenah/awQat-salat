<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — Horaires de Prière</title>
<link rel="stylesheet" href="style-admin.css">
</head>
<body>

  <h1>Administration</h1>
  <p class="subtitle">Les modifications s'appliquent sur l'écran de la mosquée dès l'enregistrement.</p>

  <section>
    <h2>Mosquée</h2>
    <label for="mosqueName">Nom de la mosquée</label>
    <input type="text" id="mosqueName" placeholder="MADINA MASJID">

    <label>Date affichée</label>
    <p class="hint">Calculée automatiquement. Si la date hijri ne correspond pas à la vue de la lune, ajustez ici :</p>
    <div class="stepper">
      <button type="button" id="hijriMinus">−</button>
      <div class="stepper-value"><span id="hijriValue">0</span><span class="stepper-label">jour(s)</span></div>
      <button type="button" id="hijriPlus">+</button>
    </div>
    <p class="hint" id="hijriPreview"></p>

  </section>

  <section>
    <h2>Horaires de prière</h2>
    <div class="prayer-grid">
      <div class="field">
        <label for="fajr">Fajr</label>
        <input type="time" id="fajr">
      </div>
      <div class="field">
        <label for="zuhr">Zuhr</label>
        <input type="time" id="zuhr">
      </div>
      <div class="field">
        <label for="asr">Asr</label>
        <input type="time" id="asr">
      </div>
      <div class="field">
        <label for="maghrib">Maghrib</label>
        <input type="time" id="maghrib">
      </div>
      <div class="field">
        <label for="isha">Isha</label>
        <input type="time" id="isha">
      </div>
      <div class="field">
        <label for="jumuah">Jum'ah</label>
        <input type="time" id="jumuah">
      </div>
    </div>
  </section>

  <section>
    <h2>Message du bas</h2>
    <label for="footerMessage">Annonce, hadith ou verset</label>
    <textarea id="footerMessage" placeholder="Texte affiché en bas de l'écran…"></textarea>

    <div class="switch-row">
      <span>Afficher ce message sur l'écran</span>
      <label class="switch">
        <input type="checkbox" id="showFooter">
        <span class="slider"></span>
      </label>
    </div>
  </section>

  <div class="savebar">
    <div id="status"></div>
    <button id="saveBtn">Enregistrer</button>
  </div>
  <footer>
    <p style="font-size: 0.875em; margin: 0;text-align: center; color:#8FA89E;">&copy; 2026 HJ. Qassim.</p>
  </footer>

<script>
  const HIJRI_MONTHS = [
    "Mouharram", "Safar", "Rabî' al-awwal", "Rabî' ath-thânî",
    "Joumada al-oula", "Joumada al-âkhira", "Rajab", "Cha'bân",
    "Ramadan", "Chawwal", "Dhou al-Qi'da", "Dhou al-Hijja"
  ];

  function gregorianToHijri(gy, gm, gd, offset){
    let jd = Math.floor((1461 * (gy + 4800 + Math.floor((gm - 14) / 12))) / 4) +
             Math.floor((367 * (gm - 2 - 12 * Math.floor((gm - 14) / 12))) / 12) -
             Math.floor((3 * Math.floor((gy + 4900 + Math.floor((gm - 14) / 12)) / 100)) / 4) +
             gd - 32075;
    jd += (offset || 0);
    let l = jd - 1948440 + 10632;
    const n = Math.floor((l - 1) / 10631);
    l = l - 10631 * n + 354;
    const j = Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719) +
              Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
    l = l - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) -
        Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
    const hm = Math.floor((24 * l) / 709);
    const hd = l - Math.floor((709 * hm) / 24);
    const hy = 30 * n + j - 30;
    return { year: hy, month: hm, day: hd };
  }

  let hijriOffset = 0;
  const hijriValueEl = document.getElementById('hijriValue');
  const hijriPreviewEl = document.getElementById('hijriPreview');

  function refreshHijriPreview(){
    if (!hijriValueEl || !hijriPreviewEl) return; // évite un plantage si l'élément est absent
    hijriValueEl.textContent = (hijriOffset > 0 ? '+' : '') + hijriOffset;
    const now = new Date();
    const h = gregorianToHijri(now.getFullYear(), now.getMonth() + 1, now.getDate(), hijriOffset);
    hijriPreviewEl.textContent = `Aujourd'hui : ${h.day} ${HIJRI_MONTHS[h.month - 1]} ${h.year}`;
  }

  const hijriMinusBtn = document.getElementById('hijriMinus');
  const hijriPlusBtn = document.getElementById('hijriPlus');
  if (hijriMinusBtn) hijriMinusBtn.addEventListener('click', () => {
    hijriOffset = Math.max(-3, hijriOffset - 1);
    refreshHijriPreview();
  });
  if (hijriPlusBtn) hijriPlusBtn.addEventListener('click', () => {
    hijriOffset = Math.min(3, hijriOffset + 1);
    refreshHijriPreview();
  });

  const els = {
    mosqueName: document.getElementById('mosqueName'),
    fajr: document.getElementById('fajr'),
    zuhr: document.getElementById('zuhr'),
    asr: document.getElementById('asr'),
    maghrib: document.getElementById('maghrib'),
    isha: document.getElementById('isha'),
    jumuah: document.getElementById('jumuah'),
    footerMessage: document.getElementById('footerMessage'),
    showFooter: document.getElementById('showFooter'),
  };
  const saveBtn = document.getElementById('saveBtn');
  const statusEl = document.getElementById('status');

  function fill(data){
    if (els.mosqueName) els.mosqueName.value = data.mosqueName || '';
    hijriOffset = Number.isFinite(data.hijriOffset) ? data.hijriOffset : 0;
    refreshHijriPreview();
    const p = data.prayers || {};
    ['fajr','zuhr','asr','maghrib','isha','jumuah'].forEach((k) => {
      if (els[k]) els[k].value = p[k] || '';
    });
    if (els.footerMessage) els.footerMessage.value = data.footerMessage || '';
    if (els.showFooter) els.showFooter.checked = !!data.showFooter;
  }

  function setStatus(text, kind){
    if (!statusEl) return;
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  refreshHijriPreview();

  fetch('/api/data')
    .then((r) => r.json())
    .then(fill)
    .catch(() => setStatus("Impossible de charger les données. Vérifiez que le téléphone est bien sur le même Wi-Fi.", 'err'));

  if (saveBtn) saveBtn.addEventListener('click', () => {
    const payload = {
      mosqueName: els.mosqueName ? els.mosqueName.value.trim() : '',
      hijriOffset: hijriOffset,
      prayers: {
        fajr: els.fajr ? els.fajr.value : '',
        zuhr: els.zuhr ? els.zuhr.value : '',
        asr: els.asr ? els.asr.value : '',
        maghrib: els.maghrib ? els.maghrib.value : '',
        isha: els.isha ? els.isha.value : '',
        jumuah: els.jumuah ? els.jumuah.value : '',
      },
      footerMessage: els.footerMessage ? els.footerMessage.value : '',
      showFooter: els.showFooter ? els.showFooter.checked : false,
    };

    saveBtn.disabled = true;
    setStatus('Enregistrement…');

    fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    })
      .then((r) => { if (!r.ok) throw new Error('bad status'); return r.json(); })
      .then(() => {
        setStatus('Enregistré ✓ — l\'écran est à jour', 'ok');
        saveBtn.disabled = false;
      })
      .catch(() => {
        setStatus('Erreur : impossible de contacter le serveur.', 'err');
        saveBtn.disabled = false;
      });
  });
</script>

</body>
</html>
