<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — Horaires de Prière</title>
<style>
  :root{
    --bg-deep: #0A1F1C;
    --bg-card: #12302B;
    --field-bg: #17392F;
    --divider: #2A4A40;
    --gold: #C9A227;
    --gold-bright: #E7C765;
    --text-primary: #F5F1E6;
    --text-muted: #8FA89E;
    --ok: #4caf6b;
    --err: #d9695f;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg-deep); color:var(--text-primary);
    font-family:'Roboto','Noto Sans','Segoe UI',Helvetica,Arial,sans-serif; }
  body{ padding: 20px 16px 100px; max-width: 560px; margin: 0 auto; }

  h1{
    font-size: clamp(1.4rem, 5vw, 1.7rem);
    font-weight:700;
    color: var(--gold-bright);
    margin: 4px 0 2px;
    text-align:center;
  }
  .subtitle{
    text-align:center; color:var(--text-muted); font-size:0.92rem; margin-bottom:22px;
  }

  section{
    background: var(--bg-card);
    border:1px solid var(--divider);
    border-radius: 16px;
    padding: 16px 16px 18px;
    margin-bottom: 16px;
  }
  section h2{
    font-size:0.95rem; font-weight:600; letter-spacing:0.03em;
    color: var(--gold); margin: 0 0 14px;
  }

  label{
    display:block; font-size:0.88rem; color:var(--text-muted);
    margin: 12px 0 6px;
  }
  label:first-of-type{ margin-top:0; }

  input[type=text], input[type=time], textarea{
    width:100%;
    background: var(--field-bg);
    border:1px solid var(--divider);
    border-radius:10px;
    color: var(--text-primary);
    font-size:1rem;
    padding: 12px 12px;
    font-family:inherit;
  }
  input:focus, textarea:focus{
    outline:none; border-color: var(--gold);
  }
  textarea{ resize:vertical; min-height:80px; line-height:1.4; }

  .prayer-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0 12px;
  }
  .prayer-grid .field{ min-width:0; }

  .switch-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:14px;
  }
  .switch-row span{ font-size:0.92rem; color: var(--text-primary); }

  .switch{ position:relative; width:48px; height:28px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; inset:0; background:#3a5850; border-radius:999px;
    transition: background .25s ease; cursor:pointer;
  }
  .slider::before{
    content:""; position:absolute; width:22px; height:22px; left:3px; top:3px;
    background:#fff; border-radius:50%; transition: transform .25s ease;
  }
  .switch input:checked + .slider{ background: var(--gold); }
  .switch input:checked + .slider::before{ transform: translateX(20px); }

  .savebar{
    position:fixed; left:0; right:0; bottom:0;
    background: linear-gradient(0deg, var(--bg-deep) 70%, transparent);
    padding: 18px 16px 20px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  #saveBtn{
    width:100%; max-width:528px;
    background: var(--gold);
    color: #17240C;
    border:none; border-radius:12px;
    font-size:1.05rem; font-weight:700;
    padding: 14px 0;
    cursor:pointer;
  }
  #saveBtn:active{ background: var(--gold-bright); }
  #saveBtn:disabled{ opacity:.6; }

  #status{
    font-size:0.88rem; min-height:1.2em;
    color: var(--text-muted);
  }
  #status.ok{ color: var(--ok); }
  #status.err{ color: var(--err); }
</style>
</head>
<body>

  <h1>Administration</h1>
  <p class="subtitle">Les modifications s'appliquent sur l'écran de la mosquée dès l'enregistrement.</p>

  <section>
    <h2>Mosquée</h2>
    <label for="mosqueName">Nom de la mosquée</label>
    <input type="text" id="mosqueName" placeholder="MADINA MASJID">

    <label for="displayDate">Date affichée</label>
    <input type="text" id="displayDate" placeholder="Lundi 14 Septembre 2026">
  </section>

  <section>
    <h2>Horaires de prière</h2>
    <div class="prayer-grid">
      <div class="field">
        <label for="fajr">Fajr</label>
        <input type="time" id="fajr">
      </div>
      <div class="field">
        <label for="zuhr">Zuhr</label>
        <input type="time" id="zuhr">
      </div>
      <div class="field">
        <label for="asr">Asr</label>
        <input type="time" id="asr">
      </div>
      <div class="field">
        <label for="maghrib">Maghrib</label>
        <input type="time" id="maghrib">
      </div>
      <div class="field">
        <label for="isha">Isha</label>
        <input type="time" id="isha">
      </div>
      <div class="field">
        <label for="jumuah">Jum'ah</label>
        <input type="time" id="jumuah">
      </div>
    </div>
  </section>

  <section>
    <h2>Message du bas</h2>
    <label for="footerMessage">Annonce, hadith ou verset</label>
    <textarea id="footerMessage" placeholder="Texte affiché en bas de l'écran…"></textarea>

    <div class="switch-row">
      <span>Afficher ce message sur l'écran</span>
      <label class="switch">
        <input type="checkbox" id="showFooter">
        <span class="slider"></span>
      </label>
    </div>
  </section>

  <div class="savebar">
    <div id="status"></div>
    <button id="saveBtn">Enregistrer</button>
  </div>
  <footer>
    <p style="font-size: 0.875em; margin: 0;text-align: center; color:#8FA89E;">&copy; 2026 HJ. Qassim.</p>
  </footer>

<script>
  const els = {
    mosqueName: document.getElementById('mosqueName'),
    displayDate: document.getElementById('displayDate'),
    fajr: document.getElementById('fajr'),
    zuhr: document.getElementById('zuhr'),
    asr: document.getElementById('asr'),
    maghrib: document.getElementById('maghrib'),
    isha: document.getElementById('isha'),
    jumuah: document.getElementById('jumuah'),
    footerMessage: document.getElementById('footerMessage'),
    showFooter: document.getElementById('showFooter'),
  };
  const saveBtn = document.getElementById('saveBtn');
  const statusEl = document.getElementById('status');

  function fill(data){
    els.mosqueName.value = data.mosqueName || '';
    els.displayDate.value = data.displayDate || '';
    const p = data.prayers || {};
    ['fajr','zuhr','asr','maghrib','isha','jumuah'].forEach((k) => {
      els[k].value = p[k] || '';
    });
    els.footerMessage.value = data.footerMessage || '';
    els.showFooter.checked = !!data.showFooter;
  }

  function setStatus(text, kind){
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  fetch('/api/data')
    .then((r) => r.json())
    .then(fill)
    .catch(() => setStatus("Impossible de charger les données. Vérifiez que le téléphone est bien sur le même Wi-Fi.", 'err'));

  saveBtn.addEventListener('click', () => {
    const payload = {
      mosqueName: els.mosqueName.value.trim(),
      displayDate: els.displayDate.value.trim(),
      prayers: {
        fajr: els.fajr.value,
        zuhr: els.zuhr.value,
        asr: els.asr.value,
        maghrib: els.maghrib.value,
        isha: els.isha.value,
        jumuah: els.jumuah.value,
      },
      footerMessage: els.footerMessage.value,
      showFooter: els.showFooter.checked,
    };

    saveBtn.disabled = true;
    setStatus('Enregistrement…');

    fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    })
      .then((r) => { if (!r.ok) throw new Error('bad status'); return r.json(); })
      .then(() => {
        setStatus('Enregistré ✓ — l\'écran est à jour', 'ok');
        saveBtn.disabled = false;
      })
      .catch(() => {
        setStatus('Erreur : impossible de contacter le serveur.', 'err');
        saveBtn.disabled = false;
      });
  });
</script>
</body>
</html>
